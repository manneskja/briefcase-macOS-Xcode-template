name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@main
    with:
      pre-commit-source: pre-commit

  verify-apps:
    name: Build apps
    needs: pre-commit
    uses: beeware/.github/.github/workflows/app-build-verify.yml@main
    with:
      python-version: ${{ matrix.python-version }}
      runner-os: macos-15
      framework: ${{ matrix.framework }}
      target-platform: macOS
      target-format: Xcode
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        framework: [ "toga", "pyside6", "pygame", "console" ]
        # Pygame hasn't published 3.14 wheels yet.
        exclude:
          - python-version: "3.14"
            framework: pygame

  broken-peer-cleanup:
    name: Native closed-peer cleanup
    runs-on: macos-15
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install briefcase==0.4.4
      - name: Obtain the embedded Python framework
        working-directory: stub
        run: python -m briefcase create macOS Xcode --app gui-stub --no-input
      - name: Exercise GUI and console hosts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          frameworks = list(Path("stub/build").glob("**/Python.xcframework/macos-*/Python.framework"))
          assert len(frameworks) == 1, frameworks
          subprocess.run([sys.executable, "tests/test_sigpipe.py", "--python-framework", str(frameworks[0])], check=True)
          PY
