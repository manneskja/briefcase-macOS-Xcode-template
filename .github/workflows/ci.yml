name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@main
    with:
      pre-commit-source: pre-commit

  verify-apps:
    name: Build apps (${{ matrix.python-version }}, ${{ matrix.framework }})
    needs: pre-commit
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        framework: [ "toga", "pyside6", "pygame", "console" ]
        # Pygame hasn't published 3.14 wheels yet.
        exclude:
          - python-version: "3.14"
            framework: pygame
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: beeware/.github
          ref: 8e2c74e9461ca02766fa490f8c850733b1f98924
          path: beeware-.github
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Oja's shipping Briefcase and matching automation
        run: |
          python -m pip install briefcase==0.4.4 \
            'git+https://github.com/beeware/briefcase.git@v0.4.4#subdirectory=automation'
      - name: Create automation app
        id: create
        uses: ./beeware-.github/.github/actions/app-create
        with:
          framework: ${{ matrix.framework == 'pygame' && 'Pygame' || matrix.framework }}
          enable-automation: true
      - name: Build, run and package with this template
        working-directory: ${{ steps.create.outputs.project-path }}
        env:
          TEMPLATE_ROOT: ${{ github.workspace }}
        run: |
          briefcase create macOS Xcode --no-input --config "template=${TEMPLATE_ROOT}"
          briefcase build macOS Xcode --no-input
          briefcase run macOS Xcode --no-input
          briefcase package macOS Xcode --no-input --adhoc-sign
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.python-version }}-${{ matrix.framework }}
          path: apps/verifyapp/logs

  broken-peer-cleanup:
    name: Native closed-peer cleanup
    runs-on: macos-15
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install briefcase==0.4.4
      - name: Obtain the embedded Python framework
        working-directory: stub
        run: python -m briefcase create macOS Xcode --app gui-stub --no-input
      - name: Exercise GUI and console hosts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          frameworks = list(Path("stub/build").glob("**/Python.xcframework/macos-*/Python.framework"))
          assert len(frameworks) == 1, frameworks
          subprocess.run([sys.executable, "tests/test_sigpipe.py", "--python-framework", str(frameworks[0])], check=True)
          PY
